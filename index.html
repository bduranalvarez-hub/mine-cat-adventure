<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a0f08" />
  <title>Mine Cat Adventure</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <span id="distance">0 m</span>
  </div>

  <!-- Pantalla previa: separa REGISTRARSE de INGRESAR. Antes ambas
       cosas pasaban por el mismo formulario, así que un nombre mal
       tecleado creaba una cuenta nueva y vacía en vez de dar error.
       Reutiliza las clases del panel de login: no necesita estilos
       propios. -->
  <div id="welcome" class="overlay login-bg hidden">
    <div class="login-panel">
      <p class="login-label" data-i18n="welcomeLabel">Bienvenido a la mina</p>
      <button id="btn-go-create" class="mode-btn" data-i18n="btnCreateAccount">CREAR CUENTA</button>
      <button id="btn-go-login" class="mode-btn" data-i18n="btnHaveAccount">YA TENGO CUENTA</button>
      <button id="btn-guest" class="link-btn" data-i18n="btnGuest">🎮 Jugar como invitado</button>
      <button id="btn-lang-welcome" class="link-btn lang-toggle" data-i18n="langBtn">🌐 Idioma: Español</button>
    </div>
  </div>

  <div id="login" class="overlay login-bg hidden">
    <div class="login-panel">
      <h2 id="login-title" class="login-title" data-i18n="loginTitleEnter">Entra a tu cuenta</h2>
      <label class="login-label" for="nick" data-i18n="loginLabel">¿Cómo te llamas, minero?</label>
      <input id="nick" type="text" maxlength="14" autocomplete="off"
             spellcheck="false" data-i18n-ph="nickPlaceholder" placeholder="Tu nombre" />
      <input id="pin" type="tel" inputmode="numeric" maxlength="8" autocomplete="off"
             data-i18n-ph="pinPlaceholder" placeholder="Clave (mín. 4 dígitos)" />
      <p id="login-error" class="login-error hidden"></p>
      <button id="btn-login" class="mode-btn" data-i18n="btnLogin">ENTRAR A LA MINA</button>
      <button id="btn-login-back" class="link-btn" data-i18n="back">VOLVER</button>
    </div>
  </div>

  <!-- El menú es la ilustración completa (img/menu-bg.jpg, con los
       botones pintados en el arte). Encima van zonas táctiles
       invisibles (.hot) alineadas con cada botón pintado y textos
       dinámicos (.menu-dyn). El arte no trae insignia de monedas ni
       nombre del jugador ni récords: esos son elementos HTML propios
       (.coin-pill2, .player-pill, spans de récord) superpuestos con
       estilo acorde. Posiciones en % de la imagen (1023x1537). -->
  <div id="menu" class="overlay menu-screen hidden">
    <div class="menu-art">
      <button id="btn-normal" class="hot" style="left:20%;top:36.1%;width:59.2%;height:8.2%"></button>
      <button id="btn-hard" class="hot" style="left:20%;top:45.9%;width:59.2%;height:8.5%"></button>
      <button id="btn-hardcore" class="hot" style="left:20%;top:55.6%;width:59.2%;height:8.5%"></button>
      <button id="btn-ranking" class="hot" style="left:20%;top:65.7%;width:59.2%;height:6.9%"></button>
      <button id="btn-shop" class="hot" style="left:20%;top:74.2%;width:59.2%;height:7.2%"></button>
      <a class="hot" href="privacy.html" style="left:38.6%;top:95.5%;width:17.6%;height:3%"></a>

      <!-- Controles propios (no pintados en el arte): se anclan con
           max() al borde VISIBLE de la pantalla, así nunca quedan
           recortados aunque la ilustración desborde en móvil. -->
      <button id="btn-add-coins" class="coin-pill2"
              style="left:calc(max(2.5cqw, 50cqw - 50vw + 10px));top:max(2.1cqw, env(safe-area-inset-top));height:4.7%">
        <!-- El "+" vuelve aquí cuando se conecte el anuncio recompensado
             (el backend ya existe: record_ad_watch / get_ad_status).
             Mientras la recompensa no esté implementada, la insignia no
             promete una acción que no ocurre: solo muestra el saldo y,
             al tocarla, avisa "próximamente". -->
        <span>🪙</span><span id="menu-coin-balance">0</span>
      </button>
      <button id="btn-lang" class="icon-btn2"
              style="right:calc(max(2cqw, 50cqw - 50vw + 10px));top:max(1.9cqw, env(safe-area-inset-top))">🌐</button>
      <button id="btn-music" class="icon-btn2"
              style="right:calc(max(2cqw, 50cqw - 50vw + 10px) + 9.4cqw);top:max(1.9cqw, env(safe-area-inset-top))">🔊</button>
      <button id="btn-logout" class="player-pill" style="left:27%;top:31.2%;width:46%;height:3.2%">
        <span data-i18n="playerPrefix">Minero:</span>&nbsp;<strong id="player-name"></strong>&nbsp;<u data-i18n="change">cambiar</u>
      </button>

      <span id="best-normal" class="menu-dyn" style="left:20%;top:41.9%;width:59.2%;height:2.3%;font-size:2.6cqw"></span>
      <span id="best-hard" class="menu-dyn" style="left:20%;top:51.7%;width:59.2%;height:2.3%;font-size:2.6cqw"></span>
      <span id="best-hardcore" class="menu-dyn" style="left:20%;top:61.5%;width:59.2%;height:2.3%;font-size:2.6cqw"></span>
      <span id="menu-coins" class="menu-dyn gold" style="left:20%;top:79.6%;width:59.2%;height:2%;font-size:2.4cqw"></span>

      <p id="guest-notice" class="guest-notice hidden">
        <span data-i18n="guestNotice">🎮 Invitado: tu progreso puede perderse.</span>
        <button id="btn-link-account" class="link-btn" data-i18n="btnLinkAccount">🔗 Vincular cuenta</button>
      </p>
    </div>
  </div>

  <div id="ranking" class="overlay hidden">
    <h2 class="rank-title" data-i18n="rankTitle">🏆 RANKING</h2>
    <div class="rank-tabs">
      <button id="tab-normal" class="tab-btn" data-i18n="tabEasy">FÁCIL</button>
      <button id="tab-hard" class="tab-btn" data-i18n="tabHard">DIFÍCIL</button>
      <button id="tab-hardcore" class="tab-btn" data-i18n="tabHardcore">HARDCORE</button>
    </div>
    <p id="rank-status" class="rank-status"></p>
    <ol id="rank-list" class="rank-list"></ol>
    <button id="btn-rank-back" class="mode-btn small" data-i18n="back">VOLVER</button>
  </div>

  <div id="shop" class="overlay hidden">
    <h2 class="rank-title" data-i18n="shopTitle">🛒 TIENDA</h2>
    <p id="shop-coins" class="coin-pill"></p>
    <p id="shop-daily" class="shop-daily"></p>
    <div id="shop-list" class="shop-list"></div>
    <div id="shop-redeem" class="shop-redeem">
      <div class="redeem-row">
        <input id="redeem-input" class="redeem-input" type="text" maxlength="40"
               autocomplete="off" autocapitalize="characters" spellcheck="false"
               data-i18n-ph="redeemPlaceholder" />
        <button id="btn-redeem" class="mode-btn small" data-i18n="redeemBtn">CANJEAR</button>
      </div>
      <p id="redeem-status" class="redeem-status hidden"></p>
    </div>
    <button id="btn-shop-back" class="mode-btn small" data-i18n="back">VOLVER</button>
  </div>

  <div id="gameover" class="overlay hidden">
    <h2 id="go-title">¡TE ESTRELLASTE!</h2>
    <p class="result"><span id="go-distance">0</span> m</p>
    <p id="go-record" class="record hidden" data-i18n="newRecord">¡NUEVO RÉCORD!</p>
    <p id="go-coins" class="go-coins hidden"></p>
    <p id="go-best" class="best"></p>
    <p id="go-retry" class="blink hidden" data-i18n="retry">TOCA PARA REINTENTAR</p>
    <div id="go-buttons" class="go-buttons hidden">
      <button id="go-share" class="mode-btn small" data-i18n="share">📤 COMPARTIR</button>
      <button id="go-menu" class="mode-btn small" data-i18n="changeMode">CAMBIAR MODO</button>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/music.js"></script>
  <script src="js/remote.js"></script>
  <script src="js/moderation.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/share.js"></script>
  <script src="js/input.js"></script>
  <script src="js/coins.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/account.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/background.js"></script>
  <script src="js/track.js"></script>
  <script src="js/obstacles.js"></script>
  <script src="js/player.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
