<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a0f08" />
  <title>Mine Cat Adventure</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <span id="distance">0 m</span>
  </div>

  <div id="login" class="overlay login-bg hidden">
    <div class="login-panel">
      <label class="login-label" for="nick" data-i18n="loginLabel">¿Cómo te llamas, minero?</label>
      <input id="nick" type="text" maxlength="14" autocomplete="off"
             spellcheck="false" data-i18n-ph="nickPlaceholder" placeholder="Tu nombre" />
      <input id="pin" type="tel" inputmode="numeric" maxlength="8" autocomplete="off"
             data-i18n-ph="pinPlaceholder" placeholder="Clave (mín. 4 dígitos)" />
      <p id="login-error" class="login-error hidden"></p>
      <button id="btn-login" class="mode-btn" data-i18n="btnLogin">ENTRAR A LA MINA</button>
      <button id="btn-guest" class="link-btn" data-i18n="btnGuest">🎮 Jugar como invitado</button>
      <button id="btn-lang-login" class="link-btn lang-toggle" data-i18n="langBtn">🌐 Idioma: Español</button>
    </div>
  </div>

  <!-- El menú es la ilustración completa (img/menu-bg.jpg, con los
       botones pintados en el arte). Encima van zonas táctiles
       invisibles (.hot) alineadas con cada botón pintado y textos
       dinámicos (.menu-dyn) sobre las zonas que se limpiaron en la
       imagen: saldo, nombre, récords, monedas de la tienda, estado de
       música e idioma. Posiciones en % de la imagen (1024x1536). -->
  <div id="menu" class="overlay menu-screen hidden">
    <div class="menu-art">
      <button id="btn-add-coins" class="hot" style="left:2.9%;top:1.8%;width:21.5%;height:4.6%"></button>
      <button id="btn-music" class="hot" style="left:76.9%;top:1.8%;width:7.3%;height:4.6%"></button>
      <button id="btn-lang" class="hot" style="left:87.7%;top:1.7%;width:7.3%;height:4.8%"></button>
      <button id="btn-logout" class="hot" style="left:27.8%;top:28.5%;width:41.5%;height:4.9%"></button>
      <button id="btn-normal" class="hot" style="left:18%;top:34.2%;width:63.5%;height:10.8%"></button>
      <button id="btn-hard" class="hot" style="left:18%;top:45.6%;width:63.5%;height:10.4%"></button>
      <button id="btn-hardcore" class="hot" style="left:18%;top:56.3%;width:63.5%;height:9.2%"></button>
      <button id="btn-ranking" class="hot" style="left:18%;top:66.1%;width:63.5%;height:6.2%"></button>
      <button id="btn-shop" class="hot" style="left:18%;top:73.2%;width:63.5%;height:8.8%"></button>
      <button id="btn-music-2" class="hot" style="left:11.7%;top:85.3%;width:26.5%;height:3.8%"></button>
      <button id="btn-lang-2" class="hot" style="left:11.7%;top:89.3%;width:37%;height:3.9%"></button>
      <a class="hot" href="privacy.html" style="left:39%;top:95.6%;width:22%;height:3%"></a>

      <span id="menu-coin-balance" class="menu-dyn gold" style="left:8.4%;top:2.3%;width:8%;height:3.7%;font-size:3.6cqw"></span>
      <span id="menu-player" class="menu-dyn" style="left:29%;top:28.5%;width:39%;height:4.9%;font-size:3.1cqw">
        <span data-i18n="playerPrefix">Minero:</span>&nbsp;<strong id="player-name"></strong>&nbsp;<u data-i18n="change">cambiar</u>
      </span>
      <span id="best-normal" class="menu-dyn" style="left:31%;top:40%;width:38%;height:3%;font-size:3.1cqw"></span>
      <span id="best-hard" class="menu-dyn" style="left:31%;top:51.5%;width:38%;height:3%;font-size:3.1cqw"></span>
      <span id="best-hardcore" class="menu-dyn" style="left:31%;top:61.6%;width:38%;height:3%;font-size:3.1cqw"></span>
      <span id="menu-coins" class="menu-dyn gold" style="left:31%;top:78.2%;width:38%;height:3%;font-size:3.1cqw"></span>
      <span id="music-state" class="menu-dyn start green" style="left:26.4%;top:85.7%;width:12%;height:3%;font-size:2.8cqw"></span>
      <span id="lang-state" class="menu-dyn start blue" style="left:31.2%;top:89.8%;width:22%;height:3%;font-size:2.8cqw"></span>

      <p id="guest-notice" class="guest-notice hidden">
        <span data-i18n="guestNotice">🎮 Invitado: tu progreso puede perderse.</span>
        <button id="btn-link-account" class="link-btn" data-i18n="btnLinkAccount">🔗 Vincular cuenta</button>
      </p>
    </div>
  </div>

  <div id="ranking" class="overlay hidden">
    <h2 class="rank-title" data-i18n="rankTitle">🏆 RANKING</h2>
    <div class="rank-tabs">
      <button id="tab-normal" class="tab-btn" data-i18n="tabEasy">FÁCIL</button>
      <button id="tab-hard" class="tab-btn" data-i18n="tabHard">DIFÍCIL</button>
      <button id="tab-hardcore" class="tab-btn" data-i18n="tabHardcore">HARDCORE</button>
    </div>
    <p id="rank-status" class="rank-status"></p>
    <ol id="rank-list" class="rank-list"></ol>
    <button id="btn-rank-back" class="mode-btn small" data-i18n="back">VOLVER</button>
  </div>

  <div id="shop" class="overlay hidden">
    <h2 class="rank-title" data-i18n="shopTitle">🛒 TIENDA</h2>
    <p id="shop-coins" class="coin-pill"></p>
    <p id="shop-daily" class="shop-daily"></p>
    <div id="shop-list" class="shop-list"></div>
    <button id="btn-shop-back" class="mode-btn small" data-i18n="back">VOLVER</button>
  </div>

  <div id="gameover" class="overlay hidden">
    <h2 id="go-title">¡TE ESTRELLASTE!</h2>
    <p class="result"><span id="go-distance">0</span> m</p>
    <p id="go-record" class="record hidden" data-i18n="newRecord">¡NUEVO RÉCORD!</p>
    <p id="go-coins" class="go-coins hidden"></p>
    <p id="go-best" class="best"></p>
    <p id="go-retry" class="blink hidden" data-i18n="retry">TOCA PARA REINTENTAR</p>
    <div id="go-buttons" class="go-buttons hidden">
      <button id="go-share" class="mode-btn small" data-i18n="share">📤 COMPARTIR</button>
      <button id="go-menu" class="mode-btn small" data-i18n="changeMode">CAMBIAR MODO</button>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/music.js"></script>
  <script src="js/remote.js"></script>
  <script src="js/moderation.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/share.js"></script>
  <script src="js/input.js"></script>
  <script src="js/coins.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/account.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/background.js"></script>
  <script src="js/track.js"></script>
  <script src="js/obstacles.js"></script>
  <script src="js/player.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
